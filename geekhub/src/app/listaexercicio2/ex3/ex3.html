<h2>Verificação de idade</h2>

<p>Idade: {{ idade }}</p>

@if (idade < 12) {
  <p>Criança</p>
} @else if (idade <= 17) {
  <p>Adolescente</p>
} @else if (idade <= 59) {
  <p>Adulto</p>
} @else {
  <p>Idoso</p>
}

<button (click)="diminuirIdade()">
  Diminuir
</button>

<button (click)="aumentarIdade()">
  Aumentar
</button>
