<h1>Exercício 11 - Carrinho de compras</h1>

<p>Produto: {{ produto }}</p>

<p>Preço: {{ preco | currency:'BRL' }}</p>

<p>Quantidade: {{ quantidade }}</p>

<button
  (click)="diminuir()"
  [disabled]="quantidade === 1">
  -
</button>

<button (click)="aumentar()">
  +
</button>

<p>
  Total: {{ preco * quantidade | currency:'BRL' }}
</p>

<button (click)="adicionarCarrinho()">
  Adicionar ao carrinho
</button>

<p>{{ mensagem }}</p>
