<h1>Exercício 9 - Controle de estoque</h1>

<label>Produto:</label>
<input type="text" [(ngModel)]="produto">

<p>Produto: {{ produto }}</p>

<p>Estoque: {{ estoque }}</p>

<button
  (click)="diminuirEstoque()"
  [disabled]="estoque === 0">
  -
</button>

<button (click)="aumentarEstoque()">
  +
</button>
